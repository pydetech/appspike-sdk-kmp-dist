<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AppSpike KMP Sample (wasm)</title>
    <style>
        :root { color-scheme: light dark; }
        body {
            margin: 0;
            padding: 16px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 14px;
            line-height: 1.45;
        }
        #app { max-width: 720px; margin: 0 auto; }
        h1 { font-size: 22px; margin: 0 0 12px; }
        h2 { font-size: 16px; margin: 16px 0 8px; }
        hr { border: none; border-top: 1px solid rgba(128, 128, 128, 0.4); margin: 16px 0; }
        .row { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; }
        button {
            font: inherit;
            padding: 8px 14px;
            border-radius: 20px;
            border: 1px solid rgba(128, 128, 128, 0.6);
            background: transparent;
            color: inherit;
            cursor: pointer;
        }
        button:hover { background: rgba(128, 128, 128, 0.15); }
        input {
            font: inherit;
            padding: 8px 10px;
            border-radius: 6px;
            border: 1px solid rgba(128, 128, 128, 0.6);
            background: transparent;
            color: inherit;
            flex: 1 1 160px;
            min-width: 0;
        }
        input.wide { flex: 1 1 100%; }
        .note { margin: 4px 0; opacity: 0.8; font-size: 13px; }
        .accent { color: #6750a4; opacity: 1; }
        .strong { font-weight: 600; margin-top: 8px; }
        .results { margin-top: 8px; }
        .entry { margin-bottom: 10px; }
        @media (prefers-color-scheme: dark) { .accent { color: #cfbcff; } }
    </style>
</head>
<body>
<div id="app"></div>
<script src="wasmApp.js"></script>
</body>
</html>
